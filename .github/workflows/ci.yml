# Nom affiché dans l'onglet "Actions" de GitHub
name: CI

# On lance ce workflow à chaque push sur la branche develop
on: 
  push:
    branches: 
      "develop"

jobs:

  # -----------------------------
  # JOB 1 : Backend (Laravel)
  # -----------------------------
  backend:
    runs-on: ubuntu-latest # machine virtuelle fournie par GitHub

    # On a besoin d'une base MySQL pour que Laravel puisse tourner les tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # Attend que MySQL soit prêt avant de continuer
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      # Récupère ton code depuis GitHub
      - uses: actions/checkout@v4

      # Installe PHP (même version que ton Dockerfile)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      # Installe les dépendances PHP (composer.json -> vendor/)
      - name: Install dependencies
        run: cd backend && composer install --no-interaction

      # Crée le fichier .env nécessaire à Laravel pour tourner
      - name: Setup .env
        run: cd backend && cp .env.example .env && php artisan key:generate

      # Lance les tests Laravel (PHPUnit/Pest)
      # DB_HOST=127.0.0.1 car le service mysql est exposé sur le runner
      - name: Run tests
        run: cd backend && php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root

  # -----------------------------
  # JOB 2 : Frontend (React)
  # -----------------------------
  frontend:
    runs-on: ubuntu-latest

    steps:
      # Récupère ton code
      - uses: actions/checkout@v4

      # Installe Node.js (même version que ton Dockerfile)
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installe les dépendances npm (package.json -> node_modules/)
      - name: Install dependencies
        run: cd frontend && npm install

      # Vérifie que le build fonctionne (détecte les erreurs de code/imports)
      - name: Build
        run: cd frontend && npm run build